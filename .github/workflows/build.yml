name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/ByesLauncher/ByesLauncher.csproj

      - name: Build (Release)
        run: dotnet build src/ByesLauncher/ByesLauncher.csproj --no-restore -c Release /warnaserror

      # No tests yet — once a tests project lands, add a `dotnet test` step here.
