name: Release

# Triggers on a pushed tag matching `v*` (e.g. `v0.1.1`). Builds the launcher,
# packs a Velopack release, and attaches the artifacts to a GitHub Release.
#
# Code signing is not currently wired up — see CHANGELOG.md and README.md for
# context. When a signing path is selected (likely SSL.com OV with eSigner cloud
# HSM), the `--signTemplate` parameter on `vpk pack` is the integration point.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # required to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so vpk can compute deltas

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v',''
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building v$ver"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Publish (self-contained)
        run: dotnet publish src/ByesLauncher/ByesLauncher.csproj -c Release -r win-x64 --self-contained -o dist/publish

      # ---------------------------------------------------------------
      # Code signing integration point — when a signing path is selected,
      # add a `--signTemplate '<sign command> {{file}}'` parameter to the
      # `vpk pack` step below. Velopack runs the template per artifact.
      # ---------------------------------------------------------------

      - name: Pack Velopack release
        run: |
          vpk pack `
            -u ByesLauncher `
            -v ${{ steps.version.outputs.version }} `
            -p dist/publish `
            -e ByesLauncher.exe `
            -o dist/releases `
            --packTitle "Backyard Esports Launcher" `
            --packAuthors "Backyard Esports" `
            --icon src/ByesLauncher/Assets/app.ico

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BYES Launcher ${{ steps.version.outputs.version }}
          body: |
            Automated release. See `dist/releases/` artifacts attached below.

            **For players:** download `ByesLauncher-win-Setup.exe`. If you
            already have the launcher installed, it will auto-update on next
            startup — no need to re-download.

            **For maintainers:** SCP the entire artifact set to
            `byes.nz:/home/ubuntu/launcher-releases/updates/` to push this
            release out to existing installations.
          files: |
            dist/releases/ByesLauncher-win-Setup.exe
            dist/releases/ByesLauncher-win-Portable.zip
            dist/releases/ByesLauncher-${{ steps.version.outputs.version }}-full.nupkg
            dist/releases/RELEASES
            dist/releases/releases.win.json
            dist/releases/assets.win.json
          fail_on_unmatched_files: true
